<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - InternHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #1f2937;
        }

        nav {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #6c4df6;
        }

        nav a {
            text-decoration: none;
            color: #4b5563;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .signup-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6c4df6;
        }

        .signup-button {
            width: 100%;
            padding: 13px;
            background: #6c4df6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .signup-button:hover {
            background: #5635e8;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #e8f8ef;
            color: #16803c;
            border-radius: 8px;
            text-align: center;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .login a {
            color: #6c4df6;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 5%;
            }

            .container {
                margin: 25px auto;
                padding: 15px;
            }

            .signup-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">
            InternHub
        </div>

        <a href="index.html">
            Home
        </a>

    </nav>


    <div class="container">

        <div class="signup-card">

            <h1>
                Create Your Account
            </h1>

            <p class="subtitle">
                Join InternHub and find your perfect internship.
            </p>


            <form id="signupForm">


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="college">
                        College Name
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter your college name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select id="course" required>

                        <option value="">
                            Select your course
                        </option>

                        <option value="B.Tech">
                            B.Tech
                        </option>

                        <option value="B.E">
                            B.E
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="B.Sc">
                            B.Sc
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                        <option value="M.Tech">
                            M.Tech
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="year">
                        Year of Study
                    </label>

                    <select id="year" required>

                        <option value="">
                            Select your year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                        <option value="Postgraduate">
                            Postgraduate
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Account
                </button>

            </form>


            <div
                class="message"
                id="message"
            ></div>


            <p class="login">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script>

        document
            .getElementById("signupForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    let name =
                        document
                            .getElementById("name")
                            .value
                            .trim();


                    let email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    let password =
                        document
                            .getElementById("password")
                            .value;


                    let college =
                        document
                            .getElementById("college")
                            .value
                            .trim();


                    let course =
                        document
                            .getElementById("course")
                            .value;


                    let year =
                        document
                            .getElementById("year")
                            .value;


                    /*
                     * Save student information
                     * in the browser.
                     */

                    localStorage.setItem(
                        "studentName",
                        name
                    );


                    localStorage.setItem(
                        "studentEmail",
                        email
                    );


                    localStorage.setItem(
                        "studentPassword",
                        password
                    );


                    localStorage.setItem(
                        "studentCollege",
                        college
                    );


                    localStorage.setItem(
                        "studentCourse",
                        course
                    );


                    localStorage.setItem(
                        "studentYear",
                        year
                    );


                    let message =
                        document
                            .getElementById("message");


                    message.style.display =
                        "block";


                    message.textContent =
                        "Welcome, " +
                        name +
                        "! Your account has been created successfully 🎉";


                    setTimeout(
                        function() {

                            window.location.href =
                                "dashboard.html";

                        },
                        1500
                    );

                }
            );

    </script>

</body>

</html>
