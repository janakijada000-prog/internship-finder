<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume Builder - InternHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fb;
            color: #222;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            min-height: 70px;
            background: white;
            border-bottom: 1px solid #e5e5e5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            color: #6847f5;
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #444;
            margin-left: 22px;
            font-size: 14px;
        }

        nav a:hover {
            color: #6847f5;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: 1100px;
            max-width: 92%;
            margin: 35px auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #666;
        }


        /* =========================
           BUILDER
        ========================= */

        .builder {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .form-card,
        .preview-card {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .form-card h2,
        .preview-card h2 {
            margin-bottom: 20px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;

            border: 1px solid #d8d8d8;
            border-radius: 7px;

            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 85px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #6847f5;
        }


        /* =========================
           SKILL SUGGESTIONS
        ========================= */

        .skill-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .skill-suggestions button {
            border: 1px solid #d8d8d8;
            background: #f5f6fb;
            color: #444;

            padding: 7px 12px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 13px;
        }

        .skill-suggestions button:hover {
            background: #6847f5;
            color: white;
            border-color: #6847f5;
        }


        /* =========================
           GENERATE BUTTON
        ========================= */

        .generate-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #6847f5;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .generate-btn:hover {
            background: #5635e8;
        }


        /* =========================
           RESUME PREVIEW
        ========================= */

        .resume {
            border: 1px solid #ddd;
            padding: 28px;
            min-height: 650px;
            background: white;
        }

        .resume-header {
            text-align: center;

            border-bottom: 2px solid #6847f5;

            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .resume-header h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .contact {
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .resume-section {
            margin-bottom: 20px;
        }

        .resume-section h3 {
            color: #6847f5;

            border-bottom: 1px solid #ddd;

            padding-bottom: 5px;
            margin-bottom: 9px;

            font-size: 17px;
        }

        .resume-section p {
            color: #444;
            line-height: 1.6;
            white-space: pre-line;
        }

        .empty-resume {
            text-align: center;
            color: #999;
            padding: 100px 20px;
        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;

            padding: 11px;

            border: none;
            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        .print-btn {
            background: #222;
            color: white;
        }

        .clear-btn {
            background: #eee;
            color: #333;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .builder {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 15px 5%;
                flex-wrap: wrap;
                gap: 10px;
            }

            nav div:last-child {
                width: 100%;

                display: flex;
                justify-content: center;

                flex-wrap: wrap;
                gap: 8px;
            }

            nav a {
                margin-left: 5px;
            }

        }


        @media (max-width: 500px) {

            .container {
                max-width: 94%;
            }

            .heading h1 {
                font-size: 28px;
            }

            .form-card,
            .preview-card {
                padding: 18px;
            }

            .resume {
                padding: 18px;
            }

            .resume-header h1 {
                font-size: 23px;
            }

        }


        /* =========================
           PRINT
        ========================= */

        @media print {

            body {
                background: white;
            }

            nav,
            .heading,
            .form-card,
            .preview-card > h2,
            .actions {
                display: none !important;
            }

            .container {
                width: 100%;
                max-width: 100%;
                margin: 0;
            }

            .builder {
                display: block;
            }

            .preview-card {
                box-shadow: none;
                padding: 0;
            }

            .resume {
                border: none;
                padding: 30px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>

        <div class="logo">
            InternHub
        </div>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="internships.html">
                Internships
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <div class="heading">

            <h1>
                Resume Builder 📝
            </h1>

            <p>
                Create a simple professional resume for your internship applications.
            </p>

        </div>


        <div class="builder">


            <!-- =========================
                 FORM
            ========================= -->

            <div class="form-card">

                <h2>
                    Enter Your Details
                </h2>


                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Your full name"
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="your@email.com"
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Your phone number"
                    >

                </div>


                <!-- OBJECTIVE -->

                <div class="form-group">

                    <label>
                        Career Objective
                    </label>

                    <textarea
                        id="objective"
                        placeholder="Example: Motivated B.Tech student seeking an internship to develop technical skills and gain real-world experience."
                    ></textarea>

                </div>


                <!-- EDUCATION -->

                <div class="form-group">

                    <label>
                        Education
                    </label>

                    <textarea
                        id="education"
                        placeholder="Your education details"
                    ></textarea>

                </div>


                <!-- SKILLS -->

                <div class="form-group">

                    <label>
                        Skills
                    </label>

                    <textarea
                        id="skills"
                        placeholder="Select skills below or type your own"
                    ></textarea>


                    <div class="skill-suggestions">

                        <button
                            type="button"
                            onclick="addSkill('Java')"
                        >
                            Java
                        </button>

                        <button
                            type="button"
                            onclick="addSkill('Python')"
                        >
                            Python
                        </button>

                        <button
                            type="button"
                            onclick="addSkill('HTML')"
                        >
                            HTML
                        </button>

                        <button
                            type="button"
                            onclick="addSkill('CSS')"
                        >
                            CSS
                        </button>

                        <button
                            type="button"
                            onclick="addSkill('JavaScript')"
                        >
                            JavaScript
                        </button>

                        <button
                            type="button"
                            onclick="addSkill('SQL')"
                        >
                            SQL
                        </button>

                        <button
                            type="button"
                            onclick="addSkill('Git')"
                        >
                            Git
                        </button>

                        <button
                            type="button"
                            onclick="addSkill('Excel')"
                        >
                            Excel
                        </button>

                    </div>

                </div>


                <!-- PROJECTS -->

                <div class="form-group">

                    <label>
                        Projects
                    </label>

                    <textarea
                        id="projects"
                        placeholder="Example: Student Internship Finder Website - Created a website to help students find internships."
                    ></textarea>

                </div>


                <!-- CERTIFICATIONS -->

                <div class="form-group">

                    <label>
                        Certifications
                    </label>

                    <textarea
                        id="certifications"
                        placeholder="Example: Python Programming Certificate, Java Fundamentals Certificate"
                    ></textarea>

                </div>


                <!-- GENERATE -->

                <button
                    class="generate-btn"
                    onclick="generateResume()"
                >
                    Generate Resume
                </button>

            </div>


            <!-- =========================
                 PREVIEW
            ========================= -->

            <div class="preview-card">

                <h2>
                    Resume Preview
                </h2>


                <div
                    id="resume"
                    class="resume"
                >

                    <div class="empty-resume">

                        <h3>
                            Your Resume Will Appear Here
                        </h3>

                        <p style="margin-top:10px;">
                            Fill in your details and click
                            "Generate Resume".
                        </p>

                    </div>

                </div>


                <!-- ACTIONS -->

                <div class="actions">

                    <button
                        class="action-btn print-btn"
                        onclick="printResume()"
                    >
                        🖨️ Print / Save PDF
                    </button>

                    <button
                        class="action-btn clear-btn"
                        onclick="clearResume()"
                    >
                        Clear
                    </button>

                </div>

            </div>


        </div>

    </main>


    <script>


        /* =========================
           LOAD STUDENT DATA
        ========================= */

        document.getElementById("name").value =
            localStorage.getItem("studentName") || "";


        document.getElementById("email").value =
            localStorage.getItem("studentEmail") || "";


        /* =========================
           LOAD EDUCATION
        ========================= */

        let college =
            localStorage.getItem("studentCollege") || "";

        let course =
            localStorage.getItem("studentCourse") || "";

        let year =
            localStorage.getItem("studentYear") || "";


        if (college || course || year) {

            document.getElementById("education").value =
                course +
                (college ? " - " + college : "") +
                (year ? " - " + year : "");

        }


        /* =========================
           ADD SKILL
        ========================= */

        function addSkill(skill) {

            let skills =
                document.getElementById("skills");


            let current =
                skills.value
                    .split(",")
                    .map(function(item) {
                        return item.trim();
                    })
                    .filter(function(item) {
                        return item !== "";
                    });


            if (!current.includes(skill)) {

                current.push(skill);

            }


            skills.value =
                current.join(", ");

        }


        /* =========================
           GENERATE RESUME
        ========================= */

        function generateResume() {

            let name =
                document.getElementById("name").value.trim();


            let email =
                document.getElementById("email").value.trim();


            let phone =
                document.getElementById("phone").value.trim();


            let objective =
                document.getElementById("objective").value.trim();


            let education =
                document.getElementById("education").value.trim();


            let skills =
                document.getElementById("skills").value.trim();


            let projects =
                document.getElementById("projects").value.trim();


            let certifications =
                document.getElementById("certifications").value.trim();


            if (!name) {

                alert("Please enter your name.");

                return;

            }


            let resume =
                document.getElementById("resume");


            resume.innerHTML = `

                <div class="resume-header">

                    <h1>
                        ${escapeHTML(name)}
                    </h1>

                    <div class="contact">

                        ${escapeHTML(email)}

                        ${phone
                            ? " | " + escapeHTML(phone)
                            : ""
                        }

                    </div>

                </div>


                ${
                    objective
                    ?
                    `
                    <div class="resume-section">

                        <h3>
                            CAREER OBJECTIVE
                        </h3>

                        <p>
                            ${escapeHTML(objective)}
                        </p>

                    </div>
                    `
                    : ""
                }


                ${
                    education
                    ?
                    `
                    <div class="resume-section">

                        <h3>
                            EDUCATION
                        </h3>

                        <p>
                            ${escapeHTML(education)}
                        </p>

                    </div>
                    `
                    : ""
                }


                ${
                    skills
                    ?
                    `
                    <div class="resume-section">

                        <h3>
                            SKILLS
                        </h3>

                        <p>
                            ${escapeHTML(skills)}
                        </p>

                    </div>
                    `
                    : ""
                }


                ${
                    projects
                    ?
                    `
                    <div class="resume-section">

                        <h3>
                            PROJECTS
                        </h3>

                        <p>
                            ${escapeHTML(projects)}
                        </p>

                    </div>
                    `
                    : ""
                }


                ${
                    certifications
                    ?
                    `
                    <div class="resume-section">

                        <h3>
                            CERTIFICATIONS
                        </h3>

                        <p>
                            ${escapeHTML(certifications)}
                        </p>

                    </div>
                    `
                    : ""
                }

            `;


            /* =========================
               SAVE RESUME DATA
            ========================= */

            localStorage.setItem(
                "resumeName",
                name
            );

            localStorage.setItem(
                "resumeEmail",
                email
            );

            localStorage.setItem(
                "resumePhone",
                phone
            );

            localStorage.setItem(
                "resumeObjective",
                objective
            );

            localStorage.setItem(
                "resumeEducation",
                education
            );

            localStorage.setItem(
                "resumeSkills",
                skills
            );

            localStorage.setItem(
                "resumeProjects",
                projects
            );

            localStorage.setItem(
                "resumeCertifications",
                certifications
            );

        }


        /* =========================
           PRINT / SAVE PDF
        ========================= */

        function printResume() {

            let resume =
                document.getElementById("resume");


            if (
                resume.querySelector(".empty-resume")
            ) {

                alert(
                    "Please generate your resume first."
                );

                return;

            }


            window.print();

        }


        /* =========================
           CLEAR
        ========================= */

        function clearResume() {

            document.getElementById("phone").value = "";

            document.getElementById("objective").value = "";

            document.getElementById("skills").value = "";

            document.getElementById("projects").value = "";

            document.getElementById("certifications").value = "";


            /* Keep automatically loaded education */

            document.getElementById("resume").innerHTML = `

                <div class="empty-resume">

                    <h3>
                        Your Resume Will Appear Here
                    </h3>

                    <p style="margin-top:10px;">
                        Fill in your details and click
                        "Generate Resume".
                    </p>

                </div>

            `;

        }


        /* =========================
           SECURITY
        ========================= */

        function escapeHTML(text) {

            let div =
                document.createElement("div");


            div.textContent =
                text;


            return div.innerHTML;

        }

    </script>


</body>

</html>
