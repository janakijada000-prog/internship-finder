<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - InternHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fb;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 420px;
            max-width: 92%;
        }

        .logo {
            text-align: center;
            color: #6847f5;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6847f5;
        }

        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #6847f5;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #5635e8;
        }

        .message {
            display: none;

            padding: 12px;
            margin-bottom: 18px;

            border-radius: 8px;

            text-align: center;
            font-size: 14px;
        }

        .error {
            background: #ffe8e8;
            color: #c62828;
        }

        .success {
            background: #e8f8ed;
            color: #188038;
        }

        .signup-text {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .signup-text a {
            color: #6847f5;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;

            color: #666;
            text-decoration: none;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 25px;
            }

            .logo {
                font-size: 26px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="logo">
            InternHub
        </div>


        <div class="login-card">

            <h1>
                Welcome Back! 👋
            </h1>

            <p class="subtitle">
                Login to manage your internships
            </p>


            <div
                id="message"
                class="message"
            ></div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        College Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


            </form>


            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>


            <a
                href="index.html"
                class="home-link"
            >
                ← Back to Home
            </a>

        </div>

    </div>



    <script>

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                    .value
                    .trim();


                const password =
                    document.getElementById("password")
                    .value;


                /*
                 * Check whether the student
                 * has created an account.
                 */

                const savedEmail =
                    localStorage.getItem(
                        "studentEmail"
                    );


                const savedPassword =
                    localStorage.getItem(
                        "studentPassword"
                    );


                /*
                 * No account found
                 */

                if (!savedEmail) {

                    showMessage(
                        "No account found. Please sign up first.",
                        "error"
                    );

                    return;

                }


                /*
                 * Check email and password
                 */

                if (
                    email === savedEmail &&
                    password === savedPassword
                ) {

                    showMessage(
                        "Login successful! Redirecting...",
                        "success"
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "dashboard.html";

                        },
                        1000
                    );


                } else {

                    showMessage(
                        "Incorrect email or password.",
                        "error"
                    );

                }

            }
        );


        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className =
                "message " + type;

            message.style.display =
                "block";

        }

    </script>


</body>

</html>
